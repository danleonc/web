name: Security checks

on:
  push:
    branches: [codex/nexafia-desarrollo]
  pull_request:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.19.0'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Exercise application rules
        run: npm run test:rules
      - name: Exercise server protections
        run: npm run test:server
      - name: Build shared application
        run: npm run build:pilot
        env:
          VITE_ENTRE_PLAZA_REAL: '1'
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium --only-shell
      - name: Exercise shared Plaza and connections
        run: npx playwright test --config playwright.real-plaza.config.ts -g 'dos cuentas comparten publicaciones y respuestas tras recargar|dos personas aceptan una solicitud antes de conversar en privado'
      - name: Exercise group continuity and reminders
        run: npx playwright test --config playwright.room-continuity.config.ts -g 'al terminar un encuentro se puede solicitar una conexión'
      - name: Scan changes for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: 'false'
          GITLEAKS_ENABLE_SUMMARY: 'false'
